[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geonames-api"
version = "0.1.0"
description = "GeoNames REST API - Geographic database with REST interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jose Mosen", email = "jomosen@example.com"}
]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2>=2.9",
    "alembic>=1.13",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tqdm>=4.67",
    "typer>=0.9",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
geonames = "geonames.presentation.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["geonames*", "shared*"]
namespaces = false
